services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  mqtt:
    image: eclipse-mosquitto:2
    ports: [ "1883:1883" ]
    volumes:
      - ./infra/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://vishal:devops@db:5432/fleet_app_db}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      OVERSPEED_KPH: ${OVERSPEED_KPH:-100}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports: [ "8000:8000" ]
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_started }
    restart: unless-stopped
  frontend:
    image: nginx:1.27-alpine
    ports: [ "8080:80" ]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./infra/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [ api ]
    restart: unless-stopped
  simulator:
    build: ./simulator
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      VEHICLE_COUNT: 5
      INTERVAL_SECONDS: 3
    depends_on: [ mqtt, api ]
    profiles: [ simulator ]
volumes:
  pgdata:
